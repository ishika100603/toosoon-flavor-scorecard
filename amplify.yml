version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 24 || nvm install 24
        - npm ci
    build:
      commands:
        - >-
          if [ -z "$NEXT_PUBLIC_SITE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-$NEXT_PUBLIC_SUPABASE_ANON_KEY}" ] || [ -z "$NEXT_PUBLIC_GOOGLE_CLIENT_ID" ] || [ -z "$GOOGLE_AI_API_KEY" ]; then
            echo "Missing required Amplify environment variables";
            exit 1;
          fi
        - printenv | awk -F= '/^(NEXT_PUBLIC_|GOOGLE_AI_API_KEY=|OPENAI_API_KEY=|X_AI_KEY=|STUDENT_BRAIN_API_URL=|STUDENT_BRAIN_CLIENT_ID=|STUDENT_BRAIN_CLIENT_SECRET=|KLIPY_API_KEY=)/ { print }' > .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
